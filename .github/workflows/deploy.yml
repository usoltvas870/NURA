name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy landing page
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: index.html
          target: /var/www/nura-ai.ru/
          strip_components: 0

      - name: Rebuild app
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            cd /opt/nura
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/usoltvas870/NURA.git
            git fetch origin
            git reset --hard origin/master
            cp -f index.html /var/www/nura-ai.ru/index.html
            cd nura_app
            docker compose up -d --build || true
