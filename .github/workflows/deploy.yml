name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — verify working tree on VPS is clean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/nura
            if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
              echo "✓ Working tree is clean — safe to deploy."
              exit 0
            else
              echo "::error::Working tree on VPS is NOT clean. Automatic deploy aborted to avoid clobbering uncommitted prod-only changes."
              echo "::error::See DEPLOY.md → «Деплой упал из-за грязного working tree» for the manual resolution pattern."
              echo ""
              echo "--- git status --porcelain ---"
              git status --porcelain
              echo "--- git diff --stat ---"
              git diff --stat
              exit 1
            fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/nura
            git fetch origin
            git pull --ff-only origin main
            bash deploy.sh
            echo "$(git rev-parse HEAD) - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /var/www/nura-ai.ru/VERSION

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if curl -sf https://nura-ai.ru/ > /dev/null; then
              echo "✓ Site is up (https://nura-ai.ru/ returned 2xx)"
            else
              echo "::error::Site check failed after deploy (https://nura-ai.ru/ did not return 2xx)"
              exit 1
            fi
