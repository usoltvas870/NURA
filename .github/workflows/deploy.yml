name: Deploy coordinated production release

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release-artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact_name }}
      target-sha: ${{ steps.names.outputs.target_sha }}
    steps:
      - name: Check out the exact workflow SHA
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"

      - name: Set up Python 3.11.9
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Log release-builder runtimes
        run: |
          python --version
          node --version

      - name: Define immutable artifact identity
        id: names
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=nura-static-$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate deterministic public metadata
        run: |
          python scripts/build_pwa_release.py --check
          node frontend/test_pwa_release.mjs

      - name: Build and verify twice
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b" release-upload
          python scripts/build_release_artifact.py build --repo-root . --target-sha "$TARGET_SHA" --output-dir "$RUNNER_TEMP/release-a"
          python scripts/build_release_artifact.py build --repo-root . --target-sha "$TARGET_SHA" --output-dir "$RUNNER_TEMP/release-b"
          cmp "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz" "$RUNNER_TEMP/release-b/nura-static-$TARGET_SHA.tar.gz"
          cmp "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz.sha256" "$RUNNER_TEMP/release-b/nura-static-$TARGET_SHA.tar.gz.sha256"
          cmp "$RUNNER_TEMP/release-a/release-manifest.json" "$RUNNER_TEMP/release-b/release-manifest.json"
          python scripts/build_release_artifact.py verify \
            --archive "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz" \
            --checksum "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz.sha256" \
            --manifest "$RUNNER_TEMP/release-a/release-manifest.json" \
            --target-sha "$TARGET_SHA"
          cp "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz" release-upload/
          cp "$RUNNER_TEMP/release-a/nura-static-$TARGET_SHA.tar.gz.sha256" release-upload/
          cp "$RUNNER_TEMP/release-a/release-manifest.json" release-upload/

      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: release-upload/
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

  deploy:
    needs: build-release-artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: ${{ needs.build-release-artifact.outputs.target-sha }}
      ARTIFACT_NAME: ${{ needs.build-release-artifact.outputs.artifact-name }}
      INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.build-release-artifact.outputs.target-sha }}
    steps:
      - name: Download exact artifact from build job
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-download

      - name: Verify runner-side archive checksum
        run: |
          cd release-download
          sha256sum --check "nura-static-$TARGET_SHA.tar.gz.sha256"
          test -f release-manifest.json

      - name: Transfer to unique non-active incoming directory
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: release-download/*
          target: /var/tmp/nura-release-incoming/${{ env.INCOMING_ID }}
          strip_components: 1
          overwrite: false

      - name: Prepare exact release and execute managed State B activation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          INCOMING_ID: ${{ env.INCOMING_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: TARGET_SHA,INCOMING_ID
          script: |
            bash -se <<'NURA_DEPLOY_BOOTSTRAP'
            set -Eeuo pipefail
            [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INCOMING_ID" == *"$TARGET_SHA" ]]
            cd /opt/nura
            git fetch --no-tags origin main
            git cat-file -e "$TARGET_SHA^{commit}"
            git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main
            launcher="$(mktemp)"
            trap 'rm -f "$launcher"' EXIT
            git show "$TARGET_SHA:deploy.sh" > "$launcher"
            chmod 0700 "$launcher"
            p7b() {
              git show "$TARGET_SHA:scripts/p7b_rollout.py" | python3 - "$@"
            }
            incoming="/var/tmp/nura-release-incoming/$INCOMING_ID"
            p7b_status="$(p7b status --sha "$TARGET_SHA" 2>/dev/null || true)"
            p7b_phase="$(python3 -c \
              'import json,sys; raw=sys.stdin.read(); print(json.loads(raw.split(" ",1)[1]).get("phase","absent") if raw.startswith("p7b_status ") else "absent")' \
              <<< "$p7b_status")"
            if [[ "$p7b_phase" == finalizing || "$p7b_phase" == smoke_verified || "$p7b_phase" == complete ]]; then
              p7b activate --sha "$TARGET_SHA"
              python3 - "$incoming" /var/tmp/nura-release-incoming <<'PY'
            import pathlib, shutil, sys
            incoming = pathlib.Path(sys.argv[1])
            root = pathlib.Path(sys.argv[2]).resolve(strict=True)
            if incoming.is_symlink() or incoming.resolve(strict=True).parent != root:
                raise SystemExit("unsafe resumed incoming cleanup target")
            shutil.rmtree(incoming)
            PY
              exit 0
            fi
            bash "$launcher" prepare-p7b "$TARGET_SHA" \
              "$incoming/nura-static-$TARGET_SHA.tar.gz" \
              "$incoming/nura-static-$TARGET_SHA.tar.gz.sha256" \
              "$incoming/release-manifest.json"
            p7b activate --sha "$TARGET_SHA"
            NURA_DEPLOY_BOOTSTRAP

      - name: Verify public release contracts
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -Eeuo pipefail
          base_url=https://nura-ai.ru
          for endpoint in / /VERSION /service-worker.js /pwa-release.js /pwa-release.json /manifest.json /offline.html /app/ /app/index.html /app/nura-pwa.js /health /vk-callback.html; do
            curl --fail --silent --show-error "$base_url$endpoint" --output /dev/null
          done
          test "$(curl --fail --silent --show-error "$base_url/VERSION" | awk 'NR==1 {print $1; exit}')" = "$TARGET_SHA"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' 'https://www.nura-ai.ru/app/?release-check=1')" = 'https://nura-ai.ru/app/?release-check=1'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' 'http://www.nura-ai.ru/app/?release-check=1')" = 'https://nura-ai.ru/app/?release-check=1'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' 'http://nura-ai.ru/app/?release-check=1')" = 'https://nura-ai.ru/app/?release-check=1'
