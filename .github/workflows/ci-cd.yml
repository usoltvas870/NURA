name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nura_app

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('nura_app/requirements-dev.txt', 'nura_app/constraints-py311.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py311.txt
          python -m pip check

      - name: Ruff check
        run: python -m ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nura_app

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('nura_app/requirements-dev.txt', 'nura_app/constraints-py311.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py311.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest
        env:
          APP_ENV: test
          REDIS_URL: redis://localhost:***@v4

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 45.144.178.118
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/nura
            git pull origin main
            cd nura_app
            docker compose up -d --build api --no-deps
            docker compose up -d --build bot --no-deps
            docker compose up -d --build celery-worker celery-beat --no-deps
