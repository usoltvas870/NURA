x-app-redis-environment: &app-redis-environment
  APP_ENV: development
  TEST_MODE: "true"
  REDIS_PASSWORD: ""
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ""
  CELERY_RESULT_BACKEND: ""
  NURA_CELERY_BROKER_URL: redis://redis:6379/1
  NURA_CELERY_RESULT_BACKEND: redis://redis:6379/2
  PYTHONPATH: /app

services:
  redis:
    image: redis:7-alpine
    command: ["/bin/sh", "/usr/local/bin/nura-redis-entrypoint"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ../../scripts/redis-entrypoint.sh:/usr/local/bin/nura-redis-entrypoint:ro
      - ../../scripts/redis-healthcheck.sh:/usr/local/bin/nura-redis-healthcheck:ro
    tmpfs:
      - /run/nura-redis:mode=0700
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/nura-redis-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

  celery-worker:
    image: nura-p7b-celery-integration:${TARGET_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${TARGET_SHA}
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A core.tasks worker --loglevel=info --concurrency=2

  celery-beat:
    image: nura-p7b-celery-integration:${TARGET_SHA}
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A core.tasks beat --loglevel=info

secrets:
  redis_password:
    environment: REDIS_PASSWORD

volumes:
  redis_data:
