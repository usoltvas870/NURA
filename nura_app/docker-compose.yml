x-app-redis-environment: &app-redis-environment
  REDIS_PASSWORD: ""
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/bin/nura-redis-entrypoint"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/nura-redis-entrypoint:ro
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/nura-redis-healthcheck:ro
    tmpfs:
      - /run/nura-redis:mode=0700
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/nura-redis-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - reports_output:/app/templates/reports/output
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: python -m bot.main
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A core.tasks worker --loglevel=info --concurrency=2
    volumes:
      - reports_output:/app/templates/reports/output
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A core.tasks beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - redis_password
    environment:
      <<: *app-redis-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m admin_bot.main
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net


volumes:
  postgres_data:
  redis_data:
  reports_output:

networks:
  nura_net:
    driver: bridge

secrets:
  redis_password:
    environment: REDIS_PASSWORD
