x-app-base-environment: &app-base-environment
  SECRET_KEY_FILE: /run/secrets/secret_key
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ""
  CELERY_RESULT_BACKEND: ""
  NURA_CELERY_BROKER_URL: redis://redis:6379/1
  NURA_CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - source: postgres_password
        target: postgres_password
        mode: 0444
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/bin/nura-redis-entrypoint"]
    secrets:
      - source: redis_password
        target: redis_password
        mode: 0444
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/nura-redis-entrypoint:ro
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/nura-redis-healthcheck:ro
    tmpfs:
      - /run/nura-redis:mode=0700
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/nura-redis-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - secret_key
      - database_url
      - redis_password
      - telegram_bot_token
      - deepseek_api_key
      - vapid_private_key
      - admin_token
      - vk_client_secret
    environment:
      <<: *app-base-environment
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      VK_CLIENT_SECRET_FILE: /run/secrets/vk_client_secret
      RUN_MIGRATIONS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - reports_output:/app/templates/reports/output
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - secret_key
      - database_url
      - redis_password
      - telegram_bot_token
      - deepseek_api_key
    environment:
      <<: *app-base-environment
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      NURA_TG_POLLING_ENABLED: ${NURA_TG_POLLING_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: python -m bot.main
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - secret_key
      - database_url
      - redis_password
      - telegram_bot_token
      - deepseek_api_key
      - vapid_private_key
      - admin_bot_token
      - smtp_password
    environment:
      <<: *app-base-environment
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      ADMIN_BOT_TOKEN_FILE: /run/secrets/admin_bot_token
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A core.tasks worker --loglevel=info --concurrency=2
    volumes:
      - reports_output:/app/templates/reports/output
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - secret_key
      - database_url
      - redis_password
    environment:
      <<: *app-base-environment
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A core.tasks beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

  admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - secret_key
      - database_url
      - redis_password
      - admin_bot_token
      - deepseek_api_key
    environment:
      <<: *app-base-environment
      ADMIN_BOT_TOKEN_FILE: /run/secrets/admin_bot_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m admin_bot.main
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nura_net

volumes:
  postgres_data:
  redis_data:
  reports_output:

networks:
  nura_net:
    driver: bridge

secrets:
  postgres_password:
    file: /opt/nura/secrets/production/postgres_password
  secret_key:
    file: /opt/nura/secrets/production/secret_key
  database_url:
    file: /opt/nura/secrets/production/database_url
  redis_password:
    file: /opt/nura/secrets/production/redis_password
  telegram_bot_token:
    file: /opt/nura/secrets/production/telegram_bot_token
  deepseek_api_key:
    file: /opt/nura/secrets/production/deepseek_api_key
  vapid_private_key:
    file: /opt/nura/secrets/production/vapid_private_key
  admin_bot_token:
    file: /opt/nura/secrets/production/admin_bot_token
  admin_token:
    file: /opt/nura/secrets/production/admin_token
  smtp_password:
    file: /opt/nura/secrets/production/smtp_password
  vk_client_secret:
    file: /opt/nura/secrets/production/vk_client_secret
