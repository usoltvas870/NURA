name: nura_tg

x-pilot-environment: &pilot-environment
  REDIS_PASSWORD: ""
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ""
  CELERY_RESULT_BACKEND: ""
  NURA_CELERY_BROKER_URL: redis://redis:6379/1
  NURA_CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_TASK_QUEUE: nura_tg
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  DATABASE_URL_FILE: /run/secrets/database_url
  NURA_RUNTIME_PROFILE: nura_tg
  NURA_TG_PILOT: "true"
  NURA_TG_POLLING_ENABLED: ${NURA_TG_POLLING_ENABLED:-false}
  YOOKASSA_SHOP_ID: ""
  YOOKASSA_SECRET_KEY: ""

services:
  redis:
    image: redis:7-alpine
    command: ["/bin/sh", "/usr/local/bin/nura-redis-entrypoint"]
    secrets: [redis_password]
    volumes:
      - nura_tg_redis_data:/data
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/nura-redis-entrypoint:ro
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/nura-redis-healthcheck:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/nura-redis-healthcheck"]
    networks: [pilot, legacy_postgres]
  bot:
    build: .
    environment:
      <<: *pilot-environment
      APP_ENV: staging
      TEST_MODE: "false"
    secrets: [redis_password, telegram_bot_token, database_url]
    depends_on: {redis: {condition: service_healthy}}
    command: python -m bot.main
    networks: [pilot, legacy_postgres]
  celery-worker:
    build: .
    environment:
      <<: *pilot-environment
      APP_ENV: staging
      TEST_MODE: "false"
      PYTHONPATH: /app
    secrets: [redis_password, telegram_bot_token, database_url]
    depends_on: {redis: {condition: service_healthy}}
    command: celery -A core.tasks worker --loglevel=info --queues=nura_tg
    networks: [pilot, legacy_postgres]
volumes:
  nura_tg_redis_data: {name: nura_tg_redis_data}
networks:
  pilot: {name: nura_tg_net}
  legacy_postgres: {external: true, name: ${NURA_TG_POSTGRES_NETWORK:-nura_app_nura_net}}
secrets:
  redis_password: {file: ${NURA_TG_REDIS_SECRET_FILE:?required}}
  telegram_bot_token: {file: /opt/nura/secrets/nura_tg/telegram_bot_token}
  database_url: {file: /opt/nura/secrets/nura_tg/database_url}
