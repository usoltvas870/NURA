# Nginx config for nura-ai.ru
# Placed on host at /etc/nginx/sites-enabled/nura-ai.ru

server {
    server_name nura-ai.ru www.nura-ai.ru;

    # Landing page
    root /var/www/nura-ai.ru;
    index index.html;

<![CDATA[    # ── PWA static ──────────────────────────────────────────
    location = /manifest.json {
        root /var/www/nura-ai.ru;
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "application/manifest+json" always;
    }

    location = /service-worker.js {
        root /var/www/nura-ai.ru;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location /icons/ {
        root /var/www/nura-ai.ru;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /offline.html {
        root /var/www/nura-ai.ru;
        add_header Cache-Control "no-cache" always;
    }
    # ────────────────────────────────────────────────────────

    # Let's Encrypt]]>
    location /.well-known/acme-challenge/ {
        root /var/www/nura-ai.ru;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # API and Bot webhook
    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Report pages
    location /report/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API v1
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /mini {
        root /opt/nura;
        try_files /mini.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /success {
        root /opt/nura;
        try_files /success.html =404;
        add_header Cache-Control "no-cache" always;
    }

<![CDATA[    location = /app/profile {
        alias /var/www/nura-ai.ru/app/profile.html;
        add_header Cache-Control "no-cache";
    }

    location = /app/tarot {
        alias /var/www/nura-ai.ru/app/tarot.html;
        add_header Cache-Control "no-cache";
    }

    # PWA App (SPA - ^~ stops regex cache override)
    location ^~ /app/ {
        alias /var/www/nura-ai.ru/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl;]]>
    ssl_certificate /etc/letsencrypt/live/nura-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nura-ai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.nura-ai.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = nura-ai.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name nura-ai.ru www.nura-ai.ru;
    return 404;
}
