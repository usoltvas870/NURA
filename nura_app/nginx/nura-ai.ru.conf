# Nginx config for nura-ai.ru
# Placed on host at /etc/nginx/sites-enabled/nura-ai.ru

server {
    server_name nura-ai.ru;

    # Landing page
    root /var/www/nura-releases/current/public;
    index index.html;

    # ── PWA static ──────────────────────────────────────────
    location = /manifest.json {
        root /var/www/nura-releases/current/public;
        types {} default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /service-worker.js {
        root /var/www/nura-releases/current/public;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /pwa-release.js {
        root /var/www/nura-releases/current/public;
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /pwa-release.json {
        root /var/www/nura-releases/current/public;
        types { }
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /icons/ {
        root /var/www/nura-releases/current/public;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /offline.html {
        root /var/www/nura-releases/current/public;
        add_header Cache-Control "no-cache" always;
    }

    location = /VERSION {
        root /var/www/nura-releases/current/public;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /release-manifest.json {
        root /var/www/nura-releases/current/public;
        types { }
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /vk-callback.html {
        root /var/www/nura-releases/current/public;
        try_files /vk-callback.html =404;
        add_header Cache-Control "no-cache" always;
    }
    # ────────────────────────────────────────────────────────


    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/nura-ai.ru;
    }

    # /app/ static — no cache (must be before general regex)
    location ~* ^/app/.*\.(js|css|html|json)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # Static assets caching (everything else)
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # API and Bot webhook
    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Report pages
    location /report/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API v1
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /mini {
        root /var/www/nura-releases/current/public;
        try_files /mini.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /mini.html {
        root /var/www/nura-releases/current/public;
        try_files /mini.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /success {
        root /var/www/nura-releases/current/public;
        try_files /success.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /offer {
        alias /var/www/nura-releases/current/public/offer.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /contacts {
        alias /var/www/nura-releases/current/public/contacts.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /app/profile {
        alias /var/www/nura-releases/current/public/app/profile.html;
        add_header Cache-Control "no-cache";
    }

    location = /app/tarot {
        alias /var/www/nura-releases/current/public/app/tarot.html;
        add_header Cache-Control "no-cache";
    }

    # Admin Panel
    location /admin/ {
        alias /var/www/nura-releases/current/public/admin/;
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # PWA App (SPA - all routes serve index.html)
    location /app/ {
        alias /var/www/nura-releases/current/public/app/;
        try_files $uri $uri/ /app/index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nura-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nura-ai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    server_name www.nura-ai.ru;

    ssl_certificate /etc/letsencrypt/live/nura-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nura-ai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nura-ai.ru$request_uri;
}

server {
    listen 80;
    server_name nura-ai.ru www.nura-ai.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/nura-ai.ru;
    }

    location / {
        return 301 https://nura-ai.ru$request_uri;
    }
}
