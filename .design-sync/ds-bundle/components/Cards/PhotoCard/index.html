<!-- @dsCard group="Cards" name="PhotoCard" viewport.width="400" viewport.height="320" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { background: var(--bg); padding: 16px; font-family: var(--font-sans); }
</style>
</head>
<body>
<div class="photo-card" style="min-height:288px">
  <div class="photo-card-img" style="background:linear-gradient(135deg,#2a1e15 0%,#1a0f08 40%,#3d2919 70%,#1a1008 100%)"></div>
  <div class="photo-card-overlay"></div>
  <div class="photo-card-body" style="min-height:288px">
    <div class="eyebrow-light">Личный центр</div>
    <h1 class="greeting-title">Привет, <em>Алина</em></h1>
    <p class="greeting-sub">Твой отчёт, карта дня и вопросы к NURA собраны в одном месте.</p>
    <div style="margin-top:16px">
      <button class="btn btn-primary">Получить отчёт</button>
    </div>
  </div>
</div>
</body>
</html>
