<!-- @dsCard group="Cards" name="ArcaneDisplay" viewport.width="400" viewport.height="300" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { background: var(--bg); padding: 0; font-family: var(--font-sans); }
</style>
</head>
<body>
<div class="photo-card" style="min-height:300px">
  <div class="photo-card-img" style="background:linear-gradient(135deg,#12100E 0%,#2a1810 50%,#1a0e07 100%)"></div>
  <div class="photo-card-overlay" style="background:linear-gradient(to top,rgba(18,16,14,.97) 0%,rgba(18,16,14,.70) 45%,rgba(18,16,14,.35) 100%)"></div>
  <div class="photo-card-body" style="min-height:300px">
    <div class="hero-day-eyebrow">Карта дня · сегодня</div>
    <div class="arcane-roman">XIX</div>
    <div class="arcane-name">Солнце</div>
    <p class="arcane-phrase">День для ясности и открытых решений. Энергия Солнца помогает увидеть ситуацию без искажений.</p>
    <p class="arcane-advice">Совет: начни с самого важного, пока ясность не рассеялась.</p>
  </div>
</div>
</body>
</html>
