<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { background: var(--bg); padding: 24px 16px; font-family: var(--font-sans); display: grid; gap: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-s); margin-bottom: 6px; }
</style>
</head>
<body>

<div>
  <div class="label">Primary</div>
  <div class="row">
    <button class="btn btn-primary">Получить отчёт</button>
    <button class="btn btn-primary btn-full" style="max-width:200px">Полная ширина</button>
  </div>
</div>

<div>
  <div class="label">Soft</div>
  <button class="btn btn-soft">Отмена</button>
</div>

<div style="background:rgba(18,16,14,.88);padding:16px;border-radius:16px">
  <div class="label" style="color:rgba(255,255,255,.4)">Ghost (на тёмном фоне)</div>
  <div class="row">
    <button class="btn btn-ghost">Спросить NURA</button>
    <button class="btn-ghost-sm">⬆ Поделиться</button>
  </div>
</div>

</body>
</html>
