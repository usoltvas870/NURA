<title>NURA · Чат</title><style>
body{overflow:hidden;padding-bottom:0}
.app-shell{height:100dvh;display:flex;flex-direction:column}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.context{font-size:11px;color:var(--text-s);font-weight:700;letter-spacing:.04em}
.empty{margin:auto;text-align:center;display:grid;gap:16px;justify-items:center;padding:26px}
.empty-icon{width:62px;height:62px;border-radius:50%;background:rgba(184,116,63,.09);color:var(--terra);display:grid;place-items:center;font-family:var(--font-serif);font-size:30px}
.hints{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
.hints::-webkit-scrollbar{display:none}
.hint{flex:0 0 auto;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg-card);color:var(--text-m);font-size:12px;font-weight:700;cursor:pointer}
.msg{max-width:82%;display:flex;flex-direction:column;gap:4px}
.msg.nura{align-self:flex-start}.msg.user{align-self:flex-end}
.bubble{padding:11px 14px;border-radius:17px;font-size:14px;line-height:1.58;box-shadow:var(--shadow-card)}
.msg.nura .bubble{background:var(--bg-card);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--text)}
.msg.user .bubble{background:var(--terra);color:white;border-bottom-right-radius:5px}
.msg-time{font-size:10px;color:var(--text-s);padding:0 4px}
.msg.user .msg-time{text-align:right}
.input-area{flex:0 0 auto;padding:10px 12px calc(var(--tabbar-h) + 32px);border-top:1px solid var(--line);background:var(--header-bg);backdrop-filter:blur(18px)}
.input-row{display:flex;gap:8px;align-items:center;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 8px 8px 12px;box-shadow:var(--shadow-card)}
.chat-input{flex:1;border:0;background:none;outline:none;font-size:14px;line-height:1.5;min-height:24px;max-height:130px;resize:none;color:var(--text);overflow-y:auto;scrollbar-width:none}
.chat-input::-webkit-scrollbar{display:none}.chat-input::placeholder{color:var(--text-s)}
.send{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--terra);color:white;flex:0 0 auto}
.send:disabled{background:var(--line-strong);color:var(--text-s)}
.limit-note{padding:10px 14px;background:var(--bg-card-soft);border-bottom:1px solid var(--line);font-size:11px;color:var(--text-s);text-align:center}
.typing{align-self:flex-start;display:flex;gap:5px;padding:12px 16px;border-radius:17px;border-bottom-left-radius:5px;background:var(--bg-card);border:1px solid var(--line)}

@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:.9}}
</style></head><body><div class="app-shell"><header class="header"><div style="display:flex;align-items:center;gap:12px"><a href="index.html" class="nura-text-logo" aria-label="NURA"><span class="nura-star">✦</span><span class="nura-sep"></span><span class="nura-word">NURA</span></a><div><div class="context" id="status-text">отвечает на основе твоей Матрицы</div></div></div><div class="header-actions"><button class="icon-btn" onclick="clearChat()" aria-label="Очистить"><i class="ti ti-dots"></i></button><button class="icon-btn" id="themeToggle"><i class="ti ti-sun-moon"></i></button></div></header><div class="limit-note" id="limit-note">NURA отвечает через контекст твоей Матрицы и отчёта. Задавай вопросы по любым сферам жизни.</div><div class="chat-area" id="messages"><div class="empty" id="empty-state"><div class="empty-icon">✦</div><h1 class="title" style="font-size:30px">Спроси у NURA</h1><p class="lead">Я отвечаю не как обычный чат, а через контекст твоей Матрицы и отчёта.</p><div class="hints"><button class="hint" onclick="sendHint(this)">Почему я повторяю этот сценарий?</button><button class="hint" onclick="sendHint(this)">Что мне делать с деньгами?</button><button class="hint" onclick="sendHint(this)">Какой мой шаг на 7 дней?</button><button class="hint" onclick="sendHint(this)">Разбери мой главный запрос</button></div></div></div><div class="input-area"><div class="input-row"><textarea class="chat-input" id="chat-input" placeholder="Написать NURA…" rows="1"></textarea><button class="send" id="send-btn" onclick="sendMessage()" disabled aria-label="Отправить"><i class="ti ti-arrow-up"></i></button></div></div></div>

<script src="nura-pwa.js"></script>
<script type="text/javascript">
(function() {
  var N = window.NURA;
  var BASE = N.BASE, session_id = N.sessionId;
  var msgs = document.getElementById('messages'),
      inputEl = document.getElementById('chat-input'),
      sendBtn = document.getElementById('send-btn'),
      emptyState = document.getElementById('empty-state'),
      chatLog = JSON.parse(localStorage.getItem('nura_chat_log') || '[]'),
      typingEl = null;

  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    sendBtn.disabled = !this.value.trim();
  });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  chatLog.forEach(function(m) { addBubble(m.role, m.text, m.time, false); });
  if (chatLog.length) emptyState.style.display = 'none';
  scrollBottom();

  var params = new URLSearchParams(location.search);
  var q = params.get('question') || localStorage.getItem('nura_pending_question');
  if (q) {
    localStorage.removeItem('nura_pending_question');
    setTimeout(function() { inputEl.value = q; sendMessage(); }, 350);
  }

  window.clearChat = function() {
    if (!confirm('Очистить историю чата?')) return;
    localStorage.removeItem('nura_chat_log');
    chatLog = [];
    msgs.innerHTML = '';
    msgs.appendChild(emptyState);
    emptyState.style.display = 'grid';
  };

  window.sendHint = function(el) { inputEl.value = el.textContent; sendMessage(); };

  window.sendMessage = function() {
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;
    emptyState.style.display = 'none';
    var t = N.now();
    addBubble('user', text, t, true); saveMsg('user', text, t);
    showTyping();

    var history = chatLog.slice(-10).map(function(m) {
      return { role: m.role === 'nura' ? 'assistant' : 'user', content: m.text };
    });
    fetch(BASE + '/web/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Session-Id': session_id || '' },
      body: JSON.stringify({ message: text, session_id: session_id, history: history })
    })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      hideTyping();
      if (d && d.reply) { addBubble('nura', d.reply, N.now(), true); saveMsg('nura', d.reply, N.now()); }
      else { addBubble('nura', 'Что-то пошло не так. Попробуй ещё раз.', N.now(), true); saveMsg('nura', 'Что-то пошло не так. Попробуй ещё раз.', N.now()); }
    })
    .catch(function() {
      hideTyping();
      addBubble('nura', 'Нет соединения. Проверь сеть и повтори.', N.now(), true); saveMsg('nura', 'Нет соединения. Проверь сеть и повтори.', N.now());
    });
  };

  function addBubble(role, text, time, animate) {
    var wrap = document.createElement('div'); wrap.className = 'msg ' + role;
    if (animate) { wrap.style.opacity = '0'; wrap.style.transform = 'translateY(6px)'; }
    wrap.innerHTML = '<div class="bubble">' + N.escHtml(text) + '</div><span class="msg-time">' + time + '</span>';
    msgs.appendChild(wrap);
    if (animate) requestAnimationFrame(function() { wrap.style.transition = 'opacity .25s, transform .25s'; wrap.style.opacity = '1'; wrap.style.transform = 'none'; });
    scrollBottom();
  }

  function showTyping() {
    document.getElementById('status-text').textContent = 'печатает…';
    typingEl = document.createElement('div'); typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(typingEl); scrollBottom();
  }
  function hideTyping() {
    document.getElementById('status-text').textContent = 'отвечает на основе твоей Матрицы';
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function scrollBottom() { setTimeout(function() { msgs.scrollTop = msgs.scrollHeight; }, 40); }
  function saveMsg(role, text, time) {
    chatLog.push({ role: role, text: text, time: time });
    if (chatLog.length > 80) chatLog = chatLog.slice(-80);
    try { localStorage.setItem('nura_chat_log', JSON.stringify(chatLog)); } catch(e) {}
  }

  document.getElementById('themeToggle').addEventListener('click', function() {
    var next = N.toggleTheme();
    this.querySelector('i').className = 'ti ti-' + (next === 'dark' ? 'moon' : 'sun-moon');
  });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js', { scope: '/app/' });
</script>
