<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFEEE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NURA">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function(){
    var t = localStorage.getItem('nura-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<title>NURA · Нет соединения</title><meta name="description" content="Кажется, ты офлайн. Проверь интернет и попробуй снова."><style>
:root {
  --bg:#EFEEE9; --bg-soft:#F7F4EE; --bg-card:#FFFFFF; --bg-card-soft:#FBFAF6;
  --gold:#C2A476; --terra:#B8743F; --terra-d:#9C5F30; --sage:#6B8068; --violet:#7B6FE8;
  --text:#1A1A1A; --text-m:#5A5752; --text-s:#8A877E;
  --line:rgba(44,42,30,.10); --line-strong:rgba(44,42,30,.16);
  --shadow-card:0 4px 16px rgba(44,42,30,.08),0 1px 3px rgba(44,42,30,.06);
  --font-serif:'Playfair Display',Georgia,serif; --font-sans:'Manrope',system-ui,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:20px; --r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --bg:#12100E; --bg-soft:#1A1713; --bg-card:#1E1A16; --bg-card-soft:#181511;
  --gold:#C9A55C; --terra:#C9874A; --terra-d:#B8743F; --sage:#7A9275; --violet:#8D84E8;
  --text:#F2EFE7; --text-m:rgba(242,239,231,.72); --text-s:rgba(242,239,231,.48);
  --line:rgba(242,239,231,.10); --line-strong:rgba(242,239,231,.18);
  --shadow-card:0 4px 18px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.offline-wrap{width:min(100%,400px);text-align:center}
.card{background:var(--bg-card);border:1px solid rgba(255,255,255,.64);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:36px 24px}
[data-theme="dark"] .card{border-color:var(--line)}
.offline-icon{font-family:var(--font-serif);font-size:48px;line-height:1;color:var(--terra);margin-bottom:20px}
.offline-title{font-family:var(--font-serif);font-size:clamp(24px,6vw,32px);line-height:1.15;font-weight:400;letter-spacing:-.02em;margin-bottom:12px}
.offline-title em{color:var(--terra);font-style:italic}
.offline-desc{color:var(--text-m);font-size:14.5px;line-height:1.6;margin-bottom:28px}
.btn{min-height:46px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 34px;font-size:15px;font-weight:700;letter-spacing:0.02em;line-height:1.2;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--terra);color:#fff;box-shadow:0 8px 24px rgba(184,116,63,.32)}
.btn-primary:hover{background:var(--terra-d);transform:translateY(-2px);box-shadow:0 14px 32px rgba(184,116,63,.4)}
.btn-full{width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.offline-wrap{animation:fadeUp .4s ease both}
</style>
</head><body>
<div class="offline-wrap">
<div class="card">
  <div class="offline-icon">✦</div>
  <h1 class="offline-title">Кажется, ты <em>офлайн</em></h1>
  <p class="offline-desc">Проверь подключение к интернету и повтори попытку. NURA ждёт тебя.</p>
  <button class="btn btn-primary btn-full" onclick="location.reload()">Повторить попытку</button>
</div>
</div>
</body></html>
