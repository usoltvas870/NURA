<div class="cover-matrix">
  <div class="matrix-grid">
    <div class="matrix-cell">
      <span class="matrix-cell-label">небо</span>
      <span class="matrix-cell-num">{{ matrix.top }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">талант</span>
      <span class="matrix-cell-num">{{ matrix.talent_zone }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">женское</span>
      <span class="matrix-cell-num">{{ matrix.right }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">комфорт</span>
      <span class="matrix-cell-num">{{ matrix.comfort_zone }}</span>
    </div>
    <div class="matrix-cell center">
      <span class="matrix-cell-label">центр</span>
      <span class="matrix-cell-num">{{ matrix.center }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">портрет</span>
      <span class="matrix-cell-num">{{ matrix.portrait_zone }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">мужское</span>
      <span class="matrix-cell-num">{{ matrix.left }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">карма</span>
      <span class="matrix-cell-num">{{ matrix.karmic_tail[1] if matrix.karmic_tail else '' }}</span>
    </div>
    <div class="matrix-cell">
      <span class="matrix-cell-label">земля</span>
      <span class="matrix-cell-num">{{ matrix.bottom }}</span>
    </div>
  </div>
</div>
