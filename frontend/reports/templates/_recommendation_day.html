<div class="day" data-day="{{ day.number }}">
  <div class="checkbox"></div>
  <div class="d-meta">
    <span class="d-cat">
      {% if day.category == 'Тело' %}💪{% elif day.category == 'Ум' %}🧠{% elif day.category == 'Дух' %}🌟{% endif %}
      {{ day.category if day.category else 'Практика' }}
    </span>
    <span class="d-name">День {{ day.number }}</span>
  </div>
  <div class="d-task">{{ day.text }}</div>
</div>
