{% if kitchen_data %}
<div class="kitchen-toggle" id="kitchen-{{ section_key }}">
  <button class="kitchen-btn" type="button" data-toggle="kitchen-{{ section_key }}">
    <span class="arrow">▸</span>
    <span>Почему я так думаю — данные расчёта</span>
  </button>
  <div class="kitchen-body">
    <div class="kc-card">
      {% for row in kitchen_data %}
      <div class="kcr"><span class="kck">{{ row.key }}</span><span class="kcv">{{ row.value }}</span></div>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}
