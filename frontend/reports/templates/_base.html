<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Матрица Судьбы — {{ user_name }} · {{ generated_at }} · NURA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    {% include '_styles.html' %}
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>

<div class="shell">
  {% include '_nav_sidebar.html' %}

  <main class="content">
    {% block content %}{% endblock %}

    {% include '_footer.html' %}
  </main>
</div>

<button class="to-top" id="toTop" aria-label="Наверх">↑</button>

<script>
(function(){
  var sbLinks = document.querySelectorAll('#sbNav a');
  var mnList = document.getElementById('mnNav');
  if (mnList) {
    sbLinks.forEach(function(a) {
      var li = document.createElement('li');
      li.innerHTML = '<a href="' + a.getAttribute('href') + '" data-target="' + a.dataset.target + '"><span class="num">' + a.querySelector('.num').textContent + '</span><span>' + a.querySelectorAll('span')[1].textContent + '</span></a>';
      mnList.appendChild(li);
    });
  }

  var mnEl = document.getElementById('mobileNav');
  var mnToggle = document.getElementById('mnToggle');
  if (mnToggle && mnEl) {
    mnToggle.addEventListener('click', function() {
      mnEl.classList.toggle('open');
    });
  }
  if (mnList) {
    mnList.addEventListener('click', function(e) {
      if (e.target.closest('a') && mnEl) mnEl.classList.remove('open');
    });
  }

  var sections = Array.from(document.querySelectorAll('section[id]'));
  var allLinks = document.querySelectorAll('[data-target]');
  var mnCurrent = document.getElementById('mnCurrent');
  var progressBar = document.getElementById('readProgress');

  function onScroll() {
    var scrollY = window.scrollY + window.innerHeight * 0.30;
    var current = sections[0];
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].offsetTop <= scrollY) current = sections[i];
    }
    if (current) {
      var id = current.id;
      allLinks.forEach(function(a) { a.classList.toggle('active', a.dataset.target === id); });
      if (mnCurrent) {
        var active = document.querySelector('#sbNav a[data-target="' + id + '"]');
        if (active) {
          var num = active.querySelector('.num').textContent;
          var name = active.querySelectorAll('span')[1].textContent;
          mnCurrent.textContent = num + ' · ' + name;
        }
      }
    }
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var pct = Math.max(0, Math.min(100, (window.scrollY / max) * 100));
    if (progressBar) progressBar.style.width = pct + '%';

    var toTop = document.getElementById('toTop');
    if (toTop) toTop.classList.toggle('visible', window.scrollY > 500);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  document.getElementById('toTop').addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.querySelectorAll('[data-toggle]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var target = document.getElementById(btn.dataset.toggle);
      if (target) target.classList.toggle('open');
    });
  });

  var week = document.getElementById('week');
  if (week) {
    week.querySelectorAll('.day').forEach(function(d) {
      d.addEventListener('click', function() {
        d.classList.toggle('done');
      });
    });
  }
})();
</script>
</body>
</html>
