<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  (function(){
    var t = localStorage.getItem('nura-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<title>NURA · Чат</title><style>
:root {
  --bg:#EFEEE9; --bg-soft:#F7F4EE; --bg-card:#FFFFFF; --bg-card-soft:#FBFAF6;
  --gold:#C2A476; --terra:#B8743F; --terra-d:#9C5F30; --sage:#6B8068; --violet:#7B6FE8;
  --text:#1A1A1A; --text-m:#5A5752; --text-s:#8A877E;
  --line:rgba(44,42,30,.10); --line-strong:rgba(44,42,30,.16);
  --shadow-card:0 4px 16px rgba(44,42,30,.08),0 1px 3px rgba(44,42,30,.06);
  --shadow-soft:0 10px 28px rgba(44,42,30,.10),0 2px 6px rgba(44,42,30,.06);
  --font-serif:'Playfair Display',Georgia,serif; --font-sans:'Manrope',system-ui,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --tabbar-bg:rgba(239,238,233,.92); --header-bg:rgba(239,238,233,.92);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --bg:#12100E; --bg-soft:#1A1713; --bg-card:#1E1A16; --bg-card-soft:#181511;
  --gold:#C9A55C; --terra:#C9874A; --terra-d:#B8743F; --sage:#7A9275; --violet:#8D84E8;
  --text:#F2EFE7; --text-m:rgba(242,239,231,.72); --text-s:rgba(242,239,231,.48);
  --line:rgba(242,239,231,.10); --line-strong:rgba(242,239,231,.18);
  --shadow-card:0 4px 18px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.18);
  --shadow-soft:0 16px 38px rgba(0,0,0,.30);
  --tabbar-bg:rgba(18,16,14,.92); --header-bg:rgba(18,16,14,.92);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh;
  background:radial-gradient(circle at 12% 0%,rgba(194,164,118,.20),transparent 28%),
             radial-gradient(circle at 88% 8%,rgba(184,116,63,.12),transparent 26%),var(--bg);
  color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
}
a{color:inherit;text-decoration:none} button,input,textarea,select{font-family:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
.app-shell{width:min(100%,520px);margin:0 auto;min-height:100dvh;position:relative}
.header{
  position:sticky;top:0;z-index:40;height:calc(58px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 16px 0;background:var(--header-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.header-title{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--font-serif);font-size:20px;letter-spacing:.04em;font-weight:400}
.logo{display:inline-flex;align-items:center;gap:10px;letter-spacing:.18em;font-weight:700;font-size:14px;color:var(--text)}
.logo-diamond{width:14px;height:14px;border:1.5px solid var(--terra);transform:rotate(45deg);border-radius:3px;position:relative;flex:0 0 auto}
.logo-diamond::after{content:"";position:absolute;inset:3px;background:var(--gold);border-radius:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-card);border:1px solid var(--line);box-shadow:var(--shadow-card);display:grid;place-items:center;color:var(--text-m)}
.page{padding:20px 16px 28px;display:grid;gap:18px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--terra)}
.title{font-family:var(--font-serif);font-size:clamp(32px,8vw,44px);line-height:1.08;font-weight:400;letter-spacing:-.02em}
.title em{color:var(--terra);font-style:italic}
.lead{color:var(--text-m);font-size:14.5px;line-height:1.6}
.card{background:var(--bg-card);border:1px solid rgba(255,255,255,.64);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;position:relative}
[data-theme="dark"] .card{border-color:var(--line)}
.card-pad{padding:20px}
.section-block{display:grid;gap:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-s)}
.section-link{font-size:12px;color:var(--terra);font-weight:800}
.btn{min-height:46px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;font-size:13.5px;font-weight:800;line-height:1.2;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--terra);color:#fff;box-shadow:0 8px 24px rgba(184,116,63,.26)}
.btn-primary:hover{background:var(--terra-d)}
.btn-soft{background:var(--bg-card-soft);color:var(--text);border:1px solid var(--line)}
.btn-full{width:100%}
.input,.textarea,select.input{width:100%;border:1px solid var(--line-strong);background:var(--bg-card);color:var(--text);border-radius:var(--r-md);outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
.input{height:52px;padding:0 16px}.textarea{min-height:46px;max-height:130px;padding:12px 14px;resize:none;line-height:1.5}
.input:focus,.textarea:focus{border-color:rgba(184,116,63,.42);box-shadow:0 0 0 3px rgba(184,116,63,.10)}
.input::placeholder,.textarea::placeholder{color:var(--text-s)}
.meta-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-s);font-weight:800}
.small{font-size:12px;color:var(--text-s);line-height:1.5}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(64px + env(safe-area-inset-bottom,0px));padding:6px 10px env(safe-area-inset-bottom,0px);background:var(--tabbar-bg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tabbar-inner{width:min(100%,520px);height:58px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;gap:3px;color:var(--text-s);font-size:10.5px;font-weight:700;transition:background .2s,color .2s}
.tab-item .ti{font-size:22px;line-height:1}.tab-item.active{background:rgba(184,116,63,.10);color:var(--terra)}
@media(min-width:760px){
  body{padding-top:24px;padding-bottom:96px}
  .app-shell{border-radius:32px;overflow:hidden;min-height:auto;box-shadow:0 28px 80px rgba(44,42,30,.16);border:1px solid rgba(255,255,255,.66)}
  [data-theme="dark"] .app-shell{border-color:var(--line)}
  .header{position:relative}
  .tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(100%,520px);border-radius:28px 28px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media(max-width:380px){.page{padding-left:12px;padding-right:12px}.title{font-size:32px}}

body{overflow:hidden;padding-bottom:0}.app-shell{height:100dvh;display:flex;flex-direction:column}.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.context{font-size:11px;color:var(--text-s);font-weight:700;letter-spacing:.04em}.empty{margin:auto;text-align:center;display:grid;gap:16px;justify-items:center;padding:26px}.empty-icon{width:62px;height:62px;border-radius:50%;background:rgba(184,116,63,.09);color:var(--terra);display:grid;place-items:center;font-family:var(--font-serif);font-size:30px}.hints{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}.hints::-webkit-scrollbar{display:none}.hint{flex:0 0 auto;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg-card);color:var(--text-m);font-size:12px;font-weight:700}.msg{max-width:82%;display:flex;flex-direction:column;gap:4px}.msg.nura{align-self:flex-start}.msg.user{align-self:flex-end}.bubble{padding:11px 14px;border-radius:17px;font-size:14px;line-height:1.58;box-shadow:var(--shadow-card)}.msg.nura .bubble{background:var(--bg-card);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--text)}.msg.user .bubble{background:var(--terra);color:white;border-bottom-right-radius:5px}.msg-time{font-size:10px;color:var(--text-s);padding:0 4px}.msg.user .msg-time{text-align:right}.input-area{flex:0 0 auto;padding:10px 12px calc(74px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--header-bg);backdrop-filter:blur(18px)}.input-row{display:flex;gap:8px;align-items:flex-end;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 8px 8px 12px;box-shadow:var(--shadow-card)}.send{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--terra);color:white;flex:0 0 auto}.send:disabled{background:var(--line-strong);color:var(--text-s)}.limit-note{padding:10px 14px;background:rgba(194,164,118,.12);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-m)}.typing{align-self:flex-start;background:var(--bg-card);border:1px solid var(--line);border-radius:17px 17px 17px 5px;padding:13px 16px;display:flex;gap:5px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* NURA text logo from approved reference */
.nura-text-logo{display:inline-flex;align-items:center;gap:10px;color:var(--terra);white-space:nowrap}
.nura-text-logo .nura-star{font-size:18px;line-height:1;color:var(--terra);transform:translateY(-1px)}
.nura-text-logo .nura-sep{width:1px;height:18px;background:rgba(184,116,63,.32)}
.nura-text-logo .nura-word{font-family:var(--font-serif);font-weight:600;font-size:19px;letter-spacing:.16em;line-height:1;color:var(--terra)}
[data-theme="dark"] .nura-text-logo .nura-sep{background:rgba(201,165,92,.34)}

</style></head><body><div class="app-shell"><header class="header"><div style="display:flex;align-items:center;gap:12px"><span class="nura-text-logo"><span class="nura-star">✦</span><span class="nura-sep"></span><span class="nura-word">NURA</span></span><div><div class="context" id="status-text">ответы на основе твоей Матрицы</div></div></div><div class="header-actions"><button class="icon-btn" onclick="clearChat()" aria-label="Очистить"><i class="ti ti-dots"></i></button><button class="icon-btn" id="themeToggle"><i class="ti ti-sun-moon"></i></button></div></header><div class="limit-note" id="limit-note">Бесплатно: 3 вопроса в день. С полным отчётом — вопросы по главам. В подписке — расширенный чат.</div><div class="chat-area" id="messages"><div class="empty" id="empty-state"><div class="empty-icon">✦</div><h1 class="title" style="font-size:30px">Спроси у NURA</h1><p class="lead">Я отвечаю не как обычный чат, а через контекст твоей Матрицы и отчёта.</p><div class="hints"><button class="hint" onclick="sendHint(this)">Почему я повторяю этот сценарий?</button><button class="hint" onclick="sendHint(this)">Что мне делать с деньгами?</button><button class="hint" onclick="sendHint(this)">Какой мой шаг на 7 дней?</button><button class="hint" onclick="sendHint(this)">Разбери мой главный запрос</button></div></div></div><div class="input-area"><div class="input-row"><textarea class="textarea" id="chat-input" placeholder="Написать NURA…" rows="1"></textarea><button class="send" id="send-btn" onclick="sendMessage()" disabled><i class="ti ti-arrow-up"></i></button></div></div></div>
<nav class="tabbar"><div class="tabbar-inner">
<a class="tab-item " href="index.html"><i class="ti ti-home"></i><span>Главная</span></a>
<a class="tab-item " href="tarot.html"><i class="ti ti-cards"></i><span>Таро</span></a>
<a class="tab-item active" href="chat.html"><i class="ti ti-message-circle"></i><span>Чат</span></a>
<a class="tab-item " href="profile.html"><i class="ti ti-user-circle"></i><span>Профиль</span></a>
</div></nav><script>
var msgs=document.getElementById('messages'),inputEl=document.getElementById('chat-input'),sendBtn=document.getElementById('send-btn'),emptyState=document.getElementById('empty-state'),chatLog=JSON.parse(localStorage.getItem('nura_chat_log')||'[]'),typingEl=null,freeCount=Number(localStorage.getItem('nura_free_chat_count')||'0');
inputEl.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';sendBtn.disabled=!this.value.trim();});
inputEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
chatLog.forEach(function(m){addBubble(m.role,m.text,m.time,false);});if(chatLog.length) emptyState.style.display='none';
var params=new URLSearchParams(location.search);var q=params.get('question')||localStorage.getItem('nura_pending_question');if(q){localStorage.removeItem('nura_pending_question');setTimeout(function(){inputEl.value=q;sendMessage();},350);}
function clearChat(){if(!confirm('Очистить историю чата?'))return;localStorage.removeItem('nura_chat_log');chatLog=[];msgs.innerHTML='';msgs.appendChild(emptyState);emptyState.style.display='grid';}
function sendHint(el){inputEl.value=el.textContent;sendMessage();}
function sendMessage(){var text=inputEl.value.trim();if(!text)return;if(freeCount>=3&&!localStorage.getItem('nura_has_report')){addBubble('nura','Бесплатные вопросы на сегодня закончились. Полный отчёт откроет вопросы по главам, а подписка — расширенный чат.',now(),true);return;}freeCount++;localStorage.setItem('nura_free_chat_count',String(freeCount));inputEl.value='';inputEl.style.height='auto';sendBtn.disabled=true;emptyState.style.display='none';var t=now();addBubble('user',text,t,true);saveMsg('user',text,t);showTyping();setTimeout(function(){hideTyping();var reply='Смотрю на это через контекст твоей Матрицы: здесь важен не быстрый ответ, а повторяющийся сценарий. Сначала назови, где ты снова делаешь выбор из тревоги, и выбери один маленький шаг на сегодня.';addBubble('nura',reply,now(),true);saveMsg('nura',reply,now());},900);}
function addBubble(role,text,time,animate){var wrap=document.createElement('div');wrap.className='msg '+role;if(animate){wrap.style.opacity='0';wrap.style.transform='translateY(6px)';}wrap.innerHTML='<div class="bubble">'+esc(text)+'</div><span class="msg-time">'+time+'</span>';msgs.appendChild(wrap);if(animate)requestAnimationFrame(function(){wrap.style.transition='opacity .25s, transform .25s';wrap.style.opacity='1';wrap.style.transform='none';});scrollBottom();}
function showTyping(){document.getElementById('status-text').textContent='печатает…';typingEl=document.createElement('div');typingEl.className='typing';typingEl.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(typingEl);scrollBottom();}
function hideTyping(){document.getElementById('status-text').textContent='ответы на основе твоей Матрицы';if(typingEl)typingEl.remove();}
function scrollBottom(){setTimeout(function(){msgs.scrollTop=msgs.scrollHeight;},40);}function saveMsg(role,text,time){chatLog.push({role:role,text:text,time:time});if(chatLog.length>80)chatLog=chatLog.slice(-80);localStorage.setItem('nura_chat_log',JSON.stringify(chatLog));}function now(){var d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
</script>
<script>
(function(){
  var btn=document.getElementById('themeToggle'); if(!btn) return;
  var root=document.documentElement;
  btn.addEventListener('click',function(){
    var current=root.getAttribute('data-theme')||'light';
    var next=current==='dark'?'light':'dark';
    root.setAttribute('data-theme',next); localStorage.setItem('nura-theme',next);
  });
})();
</script>
</body></html>
