<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход через VK — NURA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#1a1a1a;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#222;border-radius:12px;padding:32px;text-align:center;max-width:360px;width:100%}
h1{font:28px Georgia,serif;color:#eee;margin-bottom:24px;letter-spacing:2px}
.status{font-size:14px;line-height:1.5;color:#999}
.error{color:#C45C5C;margin-bottom:18px}
.loader{display:inline-block;width:20px;height:20px;border:2px solid #444;border-top-color:#D45429;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{display:inline-block;margin-top:4px;padding:10px 22px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.retry-btn:hover{background:#333}
</style>
</head>
<body>
<div class="card">
<h1>NURA</h1>
<div class="loader" id="loader"></div>
<div class="status" id="status">Выполняем вход через VK...</div>
</div>
<script>
(function() {
  var el = document.getElementById('status');
  var loader = document.getElementById('loader');

  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  var state = params.get('state') || '';

  function renderError(msg) {
    loader.style.display = 'none';
    el.className = 'status error';
    el.textContent = msg;
    var card = el.closest('.card');
    if (card && !card.querySelector('.retry-btn')) {
      var btn = document.createElement('a');
      btn.className = 'retry-btn';
      btn.href = '/mini';
      btn.textContent = 'Попробовать ещё раз';
      card.appendChild(btn);
    }
  }

  if (error) {
    renderError('Авторизация отклонена. Попробуйте другой способ входа.');
    return;
  }
  if (!code) {
    renderError('Код авторизации не получен. Попробуйте ещё раз.');
    return;
  }

  var body = { code: code };
  if (state) body.guest_token = state;

  fetch('/api/v1/auth/vk', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify(body)
  })
  .then(function(res) {
    if (!res.ok) throw new Error('SERVER_ERROR');
    return res.json();
  })
  .then(function(result) {
    if (result.success) { location.href = '/app/'; }
    else throw new Error('SERVER_ERROR');
  })
  .catch(function() {
    renderError('Ошибка сервера. Попробуйте позже.');
  });
})();
</script>
</body>
</html>
