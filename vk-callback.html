<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход через VK — NURA</title>
<script src="/assets/vendor/vkid-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#1a1a1a;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#222;border-radius:12px;padding:32px;text-align:center;max-width:360px;width:100%}
h1{font:28px Georgia,serif;color:#eee;margin-bottom:24px;letter-spacing:2px}
.status{font-size:14px;line-height:1.5;color:#999}
.error{color:#C45C5C;margin-bottom:18px}
.loader{display:inline-block;width:20px;height:20px;border:2px solid #444;border-top-color:#D45429;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{display:inline-block;margin-top:4px;padding:10px 22px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.retry-btn:hover{background:#333}
</style>
</head>
<body>
<div class="card">
<h1>NURA</h1>
<div class="loader" id="loader"></div>
<div class="status" id="status">Выполняем вход через VK...</div>
</div>
<script>
(function() {
  var el = document.getElementById('status');
  var loader = document.getElementById('loader');

  function renderError(msg) {
    loader.style.display = 'none';
    el.className = 'status error';
    el.textContent = msg;
    var card = el.closest('.card');
    if (card && !card.querySelector('.retry-btn')) {
      var btn = document.createElement('a');
      btn.className = 'retry-btn';
      btn.href = '/mini';
      btn.textContent = 'Попробовать ещё раз';
      card.appendChild(btn);
    }
  }

  function clearVkData() {
    sessionStorage.removeItem('nura_vk_state');
    sessionStorage.removeItem('nura_vk_code_verifier');
    sessionStorage.removeItem('nura_vk_started_at');
  }

  var SDK = window.VKIDSDK;
  if (!SDK) {
    renderError('Не удалось загрузить SDK. Обновите страницу.');
    return;
  }

  var searchParams = new URLSearchParams(window.location.search);
  var payload = searchParams.get('payload');
  var callbackData;

  if (payload) {
    try { callbackData = JSON.parse(payload); } catch(e) {
      renderError('Некорректный ответ от VK.');
      clearVkData(); return;
    }
  } else {
    callbackData = {
      code: searchParams.get('code'),
      device_id: searchParams.get('device_id'),
      state: searchParams.get('state'),
      error: searchParams.get('error'),
      error_description: searchParams.get('error_description')
    };
  }

  if (callbackData.error) {
    renderError('Авторизация отклонена.');
    clearVkData(); return;
  }

  var code = callbackData.code;
  var deviceId = callbackData.device_id;
  var returnedState = callbackData.state;

  if (!code || !deviceId) {
    renderError('Неполный ответ от VK.');
    clearVkData(); return;
  }

  var expectedState = sessionStorage.getItem('nura_vk_state');
  var codeVerifier = sessionStorage.getItem('nura_vk_code_verifier');
  var startedAt = Number(sessionStorage.getItem('nura_vk_started_at'));

  if (!expectedState || !returnedState || returnedState !== expectedState) {
    renderError('Проверка безопасности не пройдена.');
    clearVkData(); return;
  }
  if (!codeVerifier) {
    renderError('Данные сессии утеряны.');
    clearVkData(); return;
  }
  if (!Number.isFinite(startedAt) || Date.now() - startedAt > 600000) {
    renderError('Время входа истекло.');
    clearVkData(); return;
  }

  SDK.Config.init({
    app: 54660807,
    redirectUrl: 'https://nura-ai.ru/vk-callback.html',
    state: expectedState,
    codeVerifier: codeVerifier,
    scope: 'email'
  });

  SDK.Auth.exchangeCode(code, deviceId, codeVerifier)
    .then(function(tokenResult) {
      if (!tokenResult || !tokenResult.access_token) {
        throw new Error('VK_ID_NO_TOKEN');
      }
      var guestToken = '';
      try { guestToken = localStorage.getItem('nura_guest_token') || ''; } catch(e) {}
      var body = { access_token: tokenResult.access_token };
      if (guestToken) body.guest_token = guestToken;
      return fetch('/api/v1/auth/vk', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify(body)
      });
    })
    .then(function(res) {
      if (!res.ok) return res.json().then(function(d) { throw new Error(d.detail || 'AUTH_FAILED'); });
      return res.json();
    })
    .then(function(result) {
      clearVkData();
      if (result.success) location.replace('/app/');
      else renderError('Не удалось завершить вход.');
    })
    .catch(function() {
      clearVkData();
      renderError('Ошибка при входе через VK.');
    });
})();
</script>
</body>
</html>
